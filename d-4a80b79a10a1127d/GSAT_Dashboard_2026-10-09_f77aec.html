<script>
(async () => {
  const show = (h, p) => { document.getElementById("msg").innerHTML = "<h1>" + h + "</h1><p>" + p + "</p>"; };
  const store = "gsat-k:" + location.pathname;
  let k = (location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/) || [])[1];
  try { if (k) sessionStorage.setItem(store, k); else k = sessionStorage.getItem(store); } catch (e) {}
  if (!k) { show("Dashboard terkunci &#128274;", "Silakan buka dashboard melalui tombol di email GSAT Daily Report. / Please open it from the button in the GSAT email."); return; }
  try {
    const b64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
    const raw = b64(document.getElementById("payload").textContent.trim());
    const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: raw.slice(0, 12)}, key, raw.slice(12)));
    history.replaceState(null, "", location.pathname + location.search);   /* key out of the address bar */
    /* document.open() is ignored while this page is still being parsed: wait for load */
    if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, {once: true}));
    document.open(); document.write(html); document.close();
  } catch (e) {
